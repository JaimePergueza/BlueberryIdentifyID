name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  unit-and-api-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run the full test suite (SQLite)
        run: pytest -v

  frontend-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install frontend dependencies
        run: npm install --no-audit --no-fund

      - name: Run frontend tests and production build
        run: npm run check

  postgres-migrations:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: blueberry
          POSTGRES_PASSWORD: blueberry
          POSTGRES_DB: blueberry_microid_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U blueberry -d blueberry_microid_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql+psycopg://blueberry:blueberry@localhost:5432/blueberry_microid_test

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Validate Alembic migrations against real PostgreSQL
        run: python scripts/check_postgres_migrations.py

      - name: Run PostgreSQL-specific tests
        run: pytest -v -m postgres tests/integration/postgres

  celery-smoke:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: blueberry
          POSTGRES_PASSWORD: blueberry
          POSTGRES_DB: blueberry_microid_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U blueberry -d blueberry_microid_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql+psycopg://blueberry:blueberry@localhost:5432/blueberry_microid_test
      CELERY_BROKER_URL: redis://localhost:6379/0
      CELERY_RESULT_BACKEND: redis://localhost:6379/1
      CELERY_TASK_ALWAYS_EAGER: "false"
      CELERY_TASK_EAGER_PROPAGATES: "true"
      API_BASE_URL: http://127.0.0.1:8000
      STORAGE_ROOT: /tmp/blueberry-storage
      BLUEBERRY_ADMIN_USERNAME: ci-admin
      BLUEBERRY_ADMIN_PASSWORD: CI-Only-Administrator-Password-42

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Apply Alembic migrations
        run: alembic upgrade head

      - name: Create CI administrator
        run: python scripts/create_admin.py

      - name: Start Celery worker
        run: |
          python -m celery -A blueberry_microid.infrastructure.tasks.celery_app.celery_app worker --loglevel=info -Q analysis --pool=solo > celery-worker.log 2>&1 &
          echo $! > celery-worker.pid
          sleep 5

      - name: Start API
        run: |
          python -m uvicorn blueberry_microid.interfaces.api.app:create_app --factory --host 127.0.0.1 --port 8000 > api.log 2>&1 &
          echo $! > api.pid
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:8000/health; then
              exit 0
            fi
            sleep 1
          done
          cat api.log
          exit 1

      - name: Run real Celery Redis smoke
        run: python scripts/celery_smoke_test.py

      - name: Show service logs on failure
        if: failure()
        run: |
          echo "===== API LOG ====="
          cat api.log || true
          echo "===== CELERY WORKER LOG ====="
          cat celery-worker.log || true

  full-stack-demo:
    runs-on: ubuntu-latest
    env:
      COMPOSE_PROJECT_NAME: blueberry-ci-${{ github.run_id }}
      POSTGRES_USER: blueberry
      POSTGRES_PASSWORD: CI-Only-Postgres-Password-42
      POSTGRES_DB: blueberry_microid_ci
      DEMO_ADMIN_USERNAME: ci-demo-admin
      DEMO_ADMIN_PASSWORD: CI-Only-Demo-Administrator-Password-42
      DEMO_SPECIALIST_USERNAME: ci-demo-specialist
      DEMO_SPECIALIST_PASSWORD: CI-Only-Demo-Specialist-Password-42
      APP_PORT: "18080"
      APP_VERSION: ci-${{ github.sha }}

    steps:
      - uses: actions/checkout@v4

      - name: Validate Docker Compose configuration
        run: docker compose --profile demo config --quiet

      - name: Build production containers
        run: docker compose --profile demo build

      - name: Start the production stack
        run: docker compose up -d postgres redis migrate api worker frontend

      - name: Wait for the public frontend
        run: |
          for i in {1..60}; do
            if curl -fsS "http://127.0.0.1:${APP_PORT}/health"; then
              exit 0
            fi
            sleep 5
          done
          docker compose ps
          docker compose logs --no-color
          exit 1

      - name: Seed synthetic demonstration data
        run: docker compose --profile demo run --rm demo-seed

      - name: Run the public-origin demonstration smoke test
        run: docker compose --profile demo run --rm demo-smoke

      - name: Show Docker logs on failure
        if: failure()
        run: docker compose --profile demo logs --no-color

      - name: Remove containers and volumes
        if: always()
        run: docker compose --profile demo down --volumes --remove-orphans
